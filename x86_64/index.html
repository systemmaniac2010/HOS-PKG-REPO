<!DOCTYPE html>
<html>
<head>
  <title>HOS Package Repo</title>
</head>
<body>
  <h1>HurricaneOS Package Repo (x86_64)</h1>
  <ul id="file-list">Loading files...</ul>

  <script>
    const username = "systemmaniac2010";
    const repo = "HOS-PKG-REPO";
    const branch = "main"; // or "gh-pages" if you use GitHub Pages branch
    const folder = "x86_64";

    fetch(`https://api.github.com/repos/systemmaniac2010/HOS-PKG-REPO/contents/x86_64?ref=main`)
      .then(response => response.json())
      .then(files => {
        const list = document.getElementById("file-list");
        list.innerHTML = "";

        files.forEach(file => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = `https://systemmaniac2010.github.io/HOS-PKG-REPO/x86_64/${file.name}`;
          a.textContent = file.name;
          li.appendChild(a);
          list.appendChild(li);
        });
      })
      .catch(error => {
        document.getElementById("file-list").innerHTML = "Failed to load files.";
        console.error(error);
      });
  </script>
</body>
</html>
